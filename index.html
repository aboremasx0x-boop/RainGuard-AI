<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0" />

    <title>RainGuard AI</title>

    <meta
        name="theme-color"
        content="#2563eb" />

    <link
        rel="manifest"
        href="manifest.json" />

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <link
        rel="stylesheet"
        href="style.css" />

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>
                🌧 RainGuard AI
            </h1>

            <p>
                منصة إنذار المطر المحلي الذكية
            </p>

        </div>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="اكتب اسم المدينة" />

            <button onclick="detectRain()">
                فحص المطر
            </button>

            <button onclick="getMyLocation()">
                موقعي الحالي
            </button>

        </div>

        <div class="card">

            <h2 id="cityName">
                جاهز للفحص
            </h2>

            <div id="statusText">
                اختر مدينة أو استخدم موقعك
            </div>

            <!-- شريط مؤشر الخطر -->
            <div
                id="riskBox"
                style="
                    margin-top:18px;
                    padding:14px;
                    border-radius:14px;
                    background:#020617;
                    border:1px solid #334155;
                ">

                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        margin-bottom:8px;
                        color:#cbd5e1;
                    ">

                    <span>
                        مؤشر الخطر
                    </span>

                    <strong id="riskValue">
                        --%
                    </strong>

                </div>

                <div
                    style="
                        width:100%;
                        height:18px;
                        background:#0f172a;
                        border-radius:999px;
                        overflow:hidden;
                        border:1px solid #334155;
                    ">

                    <div
                        id="riskBar"
                        style="
                            height:100%;
                            width:0%;
                            background:#22c55e;
                            transition:width 0.5s ease, background 0.5s ease;
                        ">
                    </div>

                </div>

                <div
                    id="riskLabel"
                    style="
                        margin-top:8px;
                        color:#94a3b8;
                        font-size:14px;
                    ">
                    لم يتم التحليل بعد
                </div>

            </div>

            <div
                id="actionMessage"
                style="
                    margin-top:10px;
                    padding:10px;
                    border-radius:10px;
                    background:#064e3b;
                    color:#d1fae5;
                    display:block;
                    min-height:24px;
                ">
            </div>

            <div id="adviceText"></div>

            <div
                id="refreshStatus"
                style="
                    margin-top:10px;
                    color:#94a3b8;
                    font-size:14px;
                ">
            </div>

        </div>

        <div class="card">

            <h3>
                رادار المطر
            </h3>

            <div id="map"></div>

        </div>

    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="app.js"></script>

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("/service-worker.js")

                    .then(() => {

                        console.log(
                            "Service Worker Registered"
                        );
                    })

                    .catch((error) => {

                        console.log(
                            "Service Worker Error:",
                            error
                        );
                    });
            });
        }

    </script>

</body>

</html>
