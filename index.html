<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0" />

    <title>RainGuard AI</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <link
        rel="stylesheet"
        href="style.css" />

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>
                🌧 RainGuard AI
            </h1>

            <p>
                منصة إنذار المطر المحلي الذكية
            </p>

        </div>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="اكتب اسم المدينة" />

            <button onclick="detectRain()">
                فحص المطر
            </button>

            <button onclick="getMyLocation()">
                موقعي الحالي
            </button>

        </div>

        <div class="card">

            <h2 id="cityName">
                جاهز للفحص
            </h2>

            <div id="statusText">
                اختر مدينة أو استخدم موقعك
            </div>

            <div
                id="actionMessage"
                style="
                    margin-top:10px;
                    padding:10px;
                    border-radius:10px;
                    background:#064e3b;
                    color:#d1fae5;
                    display:none;
                ">
            </div>

            <div id="adviceText"></div>

            <div
                id="refreshStatus"
                style="
                    margin-top:10px;
                    color:#94a3b8;
                    font-size:14px;
                ">
            </div>

        </div>

        <div class="card">

            <h3>
                رادار المطر
            </h3>

            <div id="map"></div>

        </div>

    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="app.js"></script>

</body>

</html>
