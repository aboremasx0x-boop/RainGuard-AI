
name: RainGuard Official ERA5 Tests 49O

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/match_official_era5_49n.py"
      - "scripts/test_official_era5_49o.py"
      - ".github/workflows/official-era5-tests-49o.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ERA5 matching tests
        run: python scripts/test_official_era5_49o.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-era5-tests-49o-report
          path: historical_validation/official_era5_49o_tests.json
          if-no-files-found: error
