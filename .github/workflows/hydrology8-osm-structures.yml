name: Hydrology-8 OSM structure candidate review
on:
  pull_request:
    paths:
      - 'scripts/review_hydrology8_osm_structures.py'
      - 'tests/test_hydrology8_osm_structures.py'
      - 'docs/hydrology8-osm-structures.md'
      - '.github/workflows/hydrology8-osm-structures.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_hydrology8_osm_structures.py -v
      - run: python -m unittest discover -s tests -p test_hydrology7_unified_evidence.py -v
      - run: python -m py_compile scripts/review_hydrology8_osm_structures.py
