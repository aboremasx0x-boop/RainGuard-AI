name: Hydrology-14 evidence completeness checks
on:
  pull_request:
    paths:
      - 'frontend/js/hydrology14_completeness.js'
      - 'frontend/hydrology14-completeness.html'
      - 'frontend/hydrology12-evidence-drafts.html'
      - 'tests/hydrology14_completeness.test.cjs'
      - '.github/workflows/hydrology14-completeness.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check frontend/js/hydrology14_completeness.js
      - run: node --test tests/hydrology14_completeness.test.cjs
      - run: node --test tests/hydrology13_resume_drafts.test.cjs
      - run: node --test tests/hydrology12_evidence_drafts.test.cjs
