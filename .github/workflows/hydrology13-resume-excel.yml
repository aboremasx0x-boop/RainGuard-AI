name: Hydrology-13 draft resume and Excel TSV
on:
  pull_request:
    paths:
      - 'frontend/js/hydrology13_resume_drafts.js'
      - 'frontend/js/hydrology12_evidence_drafts.js'
      - 'frontend/hydrology12-evidence-drafts.html'
      - 'tests/hydrology13_resume_drafts.test.cjs'
      - 'docs/hydrology13-resume-excel.md'
      - '.github/workflows/hydrology13-resume-excel.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check frontend/js/hydrology13_resume_drafts.js
      - run: node --check frontend/js/hydrology12_evidence_drafts.js
      - run: node --test tests/hydrology13_resume_drafts.test.cjs
      - run: node --test tests/hydrology12_evidence_drafts.test.cjs
      - run: node --test tests/hydrology11_local_review.test.cjs
