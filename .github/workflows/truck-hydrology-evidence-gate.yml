name: Truck hydrology and official evidence gate
on:
  pull_request:
    paths:
      - 'truck_hydrology_evidence_gate.py'
      - 'tests/test_truck_hydrology_evidence_gate.py'
      - '.github/workflows/truck-hydrology-evidence-gate.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_truck_hydrology_evidence_gate.py -v
      - run: python -m py_compile truck_hydrology_evidence_gate.py
