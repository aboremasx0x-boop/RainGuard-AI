name: Hydrology-16 follow-up tracker
on:
  push:
    paths:
      - 'frontend/js/hydrology16_review_tracker.js'
      - 'frontend/hydrology16-review-tracker.html'
      - 'tests/hydrology16_review_tracker.test.cjs'
      - '.github/workflows/hydrology16-review-tracker.yml'
  pull_request:
    paths:
      - 'frontend/js/hydrology16_review_tracker.js'
      - 'frontend/hydrology16-review-tracker.html'
      - 'tests/hydrology16_review_tracker.test.cjs'
      - '.github/workflows/hydrology16-review-tracker.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hydrology16_review_tracker.test.cjs
