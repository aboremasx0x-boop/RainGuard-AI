name: Truck journey command UI preview
on:
  pull_request:
    paths:
      - 'frontend/truck-journey-command-view.html'
      - 'frontend/js/truck_journey_command_view_v1.js'
      - 'frontend/national-ai-os-v30.html'
      - 'frontend/truck-routes-prototype.html'
      - 'tests/truck_journey_command_view.test.cjs'
      - '.github/workflows/truck-journey-command-view.yml'
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/truck_journey_command_view.test.cjs
      - run: node tests/operations_truck_hub.test.cjs
      - run: node tests/truck_route_risk_prototype.test.cjs
      - run: node tests/national_truck_geography.test.cjs
      - run: node --check frontend/js/truck_journey_command_view_v1.js
