
name: RainGuard Historical Evidence Gate 42C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify historical evidence
        run: python scripts/verify_historical_events.py

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainguard-historical-evidence-42c
          path: |
            data/calibration/*.csv
            data/calibration/*.json
          if-no-files-found: warn
          retention-days: 30
