name: Unified truck journey evidence report
on:
  pull_request:
    paths:
      - 'truck_journey_evidence_report.py'
      - 'tests/test_truck_journey_evidence_report.py'
      - 'docs/truck-journey-evidence-report.md'
      - '.github/workflows/truck-journey-evidence-report.yml'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_truck_journey_evidence_report.py -v
      - run: python -m unittest discover -s tests -p test_stage7_end_to_end_truck_safety.py -v
      - run: python -m py_compile truck_journey_evidence_report.py
