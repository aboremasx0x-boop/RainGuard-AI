name: Truck road-segment weather exposure safety
on:
  pull_request:
    paths:
      - 'truck_segment_weather_exposure.py'
      - 'tests/test_truck_segment_weather_exposure.py'
      - '.github/workflows/truck-segment-weather-exposure.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_truck_segment_weather_exposure.py -v
      - run: python -m py_compile truck_segment_weather_exposure.py
