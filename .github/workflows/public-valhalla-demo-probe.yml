name: Public Valhalla demo probe offline tests
on:
  pull_request:
    paths:
      - scripts/test_public_valhalla_demo.py
      - tests/test_public_valhalla_demo.py
      - docs/public-valhalla-demo-test.md
      - .github/workflows/public-valhalla-demo-probe.yml
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_public_valhalla_demo.py -v
      - run: python scripts/test_public_valhalla_demo.py --dry-run
      - run: python -m py_compile scripts/test_public_valhalla_demo.py
