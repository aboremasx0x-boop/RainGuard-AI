name: Hydrology-18 response tracker
on:
  push:
    paths:
      - 'frontend/js/hydrology18_response_log.js'
      - 'frontend/hydrology18-response-tracker.html'
      - 'tests/hydrology18_response_log.test.cjs'
      - '.github/workflows/hydrology18-response-tracker.yml'
  pull_request:
    paths:
      - 'frontend/js/hydrology18_response_log.js'
      - 'frontend/hydrology18-response-tracker.html'
      - 'tests/hydrology18_response_log.test.cjs'
      - '.github/workflows/hydrology18-response-tracker.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hydrology18_response_log.test.cjs
