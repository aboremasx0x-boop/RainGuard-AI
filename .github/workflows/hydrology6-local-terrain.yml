name: Hydrology-6 local terrain context
on:
  pull_request:
    paths:
      - 'scripts/analyze_hydrology6_local_terrain.py'
      - 'tests/test_hydrology6_local_terrain.py'
      - 'docs/hydrology6-local-terrain-windows.md'
      - '.github/workflows/hydrology6-local-terrain.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_hydrology6_local_terrain.py -v
      - run: python -m unittest discover -s tests -p test_hydrology5_srtm_hgt.py -v
      - run: python -m py_compile scripts/analyze_hydrology6_local_terrain.py
