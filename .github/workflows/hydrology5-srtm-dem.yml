name: Hydrology-5 offline DEM terrain sample tests
on:
  pull_request:
    paths:
      - 'scripts/sample_hydrology5_srtm_hgt.py'
      - 'tests/test_hydrology5_srtm_hgt.py'
      - 'docs/hydrology5-srtm-dem-sampling.md'
      - '.github/workflows/hydrology5-srtm-dem.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_hydrology5_srtm_hgt.py -v
      - run: python -m unittest discover -s tests -p test_hydrology4_acc_readiness.py -v
      - run: python -m py_compile scripts/sample_hydrology5_srtm_hgt.py
