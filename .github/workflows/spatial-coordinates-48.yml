
name: RainGuard Spatial Coordinates 48B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify spatial coordinates
        run: python scripts/verify_spatial_coordinates_48.py

      - name: Upload spatial verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainguard-spatial-coordinates-48
          path: |
            historical_validation/spatial_coordinates_48.csv
            historical_validation/spatial_coordinates_48_summary.json
          if-no-files-found: error
          retention-days: 30
