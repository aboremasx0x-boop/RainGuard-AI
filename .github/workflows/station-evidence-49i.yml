
name: RainGuard Station Evidence 49I

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/verify_station_evidence_49i.py"
      - "data/calibration/rainguard_49h_station_verification.csv"
      - ".github/workflows/station-evidence-49i.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify station evidence
        run: python scripts/verify_station_evidence_49i.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-evidence-49i-report
          path: historical_validation/station_evidence_49i_summary.json
          if-no-files-found: error
