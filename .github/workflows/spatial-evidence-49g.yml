
name: RainGuard Spatial Evidence 49G

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/verify_spatial_evidence_49g.py"
      - "data/calibration/rainguard_49f_spatial_evidence.csv"
      - ".github/workflows/spatial-evidence-49g.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify spatial evidence
        run: python scripts/verify_spatial_evidence_49g.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-evidence-49g-report
          path: historical_validation/spatial_evidence_49g_summary.json
          if-no-files-found: warn
